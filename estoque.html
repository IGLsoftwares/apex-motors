<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estoque — Apex Motors</title>
  <meta name="description" content="Estoque completo da Apex Motors: filtre por tração, 0-100, potência, câmbio e combustível.">
  <meta name="theme-color" content="#0a0a0b">
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="estoque">
  <main>
    <section class="page-hero">
      <div class="container">
        <nav class="crumbs" aria-label="Você está em"><a href="index.html">Início</a><span>/</span><span id="crumb">Estoque</span></nav>
        <h1 class="h-display" id="title">Estoque completo</h1>
        <p class="lead" id="subtitle">Todos os carros com laudo cautelar aprovado, revisados e prontos para entrega.</p>
        <div class="cat-pills" id="pills"></div>
      </div>
    </section>

    <div class="container shop">
      <aside class="filters" id="filters" aria-label="Filtros">
        <div class="filters-head"><h3>Filtros</h3><button class="close-btn" data-close aria-label="Fechar filtros"></button></div>
        <div id="filter-groups"></div>
        <div class="filters-apply"><button class="btn btn-primary btn-block" data-close id="apply-btn">Ver resultados</button></div>
      </aside>

      <section aria-label="Resultados">
        <div class="results-bar">
          <span class="count" id="count"></span>
          <div class="right">
            <button class="btn btn-outline btn-sm filter-open" id="filter-open" data-open="filters" data-icon="filter">Filtros</button>
            <label class="sr-only" for="sort">Ordenar por</label>
            <select class="select" id="sort">
              <option value="relevancia">Mais relevantes</option>
              <option value="preco-asc">Menor preço</option>
              <option value="preco-desc">Maior preço</option>
              <option value="potencia">Mais potentes</option>
              <option value="zero">Mais rápidos (0-100)</option>
              <option value="ano">Mais novos</option>
              <option value="km">Menor quilometragem</option>
            </select>
          </div>
        </div>
        <div class="active-chips" id="chips"></div>
        <div class="grid-cars" id="grid"></div>
      </section>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/estoque.js"></script>
</body>
</html>
